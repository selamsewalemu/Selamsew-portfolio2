services:
  # 1. Backend API Web Service
  - type: web
    name: selamsew-portfolio-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: EMAIL_TO
        value: selamsewdmu@gmail.com

  # 2. Frontend React & Vite Static Site
  - type: web
    name: selamsew-portfolio-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://selamsew211-1.onrender.com/api
