name: Node.js CI (Build & Validate)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Build Frontend (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and Build Frontend
        run: |
          npm install
          npm run build
        working-directory: ./frontend

  backend:
    name: Validate Backend (Node.js & Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and Validate Backend
        run: |
          npm install
          node -c src/server.js
        working-directory: ./backend
